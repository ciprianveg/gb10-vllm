# GLM-5.2 Int4-Int8Mix + Baseten MoonViT vision — TP8+PP1 on 8× GB10, v18.1-vision image
#
# NVFP4 KV-cache OPT-IN variant (kv-cache-dtype = nvfp4_ds_mla). Same v18.1-vision image and
# the same adaptive MTP 2/4/5 / num_speculative_tokens=5 settings as the fp8 default recipe.
#
# WHEN TO USE THIS INSTEAD OF THE fp8 DEFAULT:
#   Only when you need MORE CONTEXT than fp8 provides. NVFP4 MLA KV cache packs KV at
#   kv_gmem_stride=432 vs fp8's 656 -> ~1.52x more tokens per GiB of KV memory (NOT 2x: the
#   128-byte BF16 RoPE block stays uncompressed). At max-model-len=410000 / GMU=0.69 this
#   yields a ~888K-token KV pool (vs ~584K fp8-equivalent). Raise max-model-len / GMU to use it.
#
# IMPORTANT: use `--kv-cache-dtype nvfp4_ds_mla` (the MLA-native NVFP4 path), NOT plain `nvfp4`.
#   Plain `nvfp4` is a different, MLA-incompatible path that vLLM rejects with
#   "nvfp4 KV cache is not supported with MLA backends". The B12X_MLA_SPARSE backend
#   explicitly supports nvfp4_ds_mla (analogous to fp8_ds_mla).
#
# STABILITY: NVFP4 KV cache can silently produce incorrect output instead of crashing —
#   validate your workload (deterministic text, needle-in-a-haystack at depth) before trusting
#   it. See vllm issue #43562 for the original SM120 stability concern. The native sm_121 path
#   on GB10 has held up under mixed load in testing, with one unexplained stall observed once.
#
# Image: linux/arm64, built for GB10 / sm_121 — will NOT run on x86_64.
# Prebuilt: docker pull ghcr.io/ciprianveg/gb10-glm-5.2:v18.1-vision


recipe_version: "1"
name: GLM-5.2-Int4-Int8-TP8-v18.1-vision-nvfp4
description: GLM-5.2 Int4-Int8Mix + Baseten MoonViT vision, 8× GB10, v18.1-vision image, NVFP4 KV cache (opt-in for max context), adaptive MTP 2/4/5 + vision
raw_entrypoint: true
shared_weights_nfs: true
cluster_only: true

# v18.1-vision image (native sm_121 cubins + NVFP4 MLA KV-cache kernels). Same image as the
# fp8 default recipe — only the KV cache dtype differs.
container: ghcr.io/ciprianveg/gb10-glm-5.2:v18.1-vision

# Composite model dir — symlinks into GLM-5.2-Int4-Int8 and baseten-GLM-5.2-Vision-NVFP4.
model: /root/models/models14/glm52-quanttrio-vision

# Environment — identical to the fp8 v18-vision recipe (NVFP4 needs no env changes)
env:
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  LD_PRELOAD: /opt/libnccl-local-inference.so.2.30.4
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"

  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  GLM52_BIND_HOST_TRITON: "0"
  VLLM_B12X_MLA_SPEC_EXTEND_AS_DECODE: "1"

  TORCH_CUDA_ARCH_LIST: "12.1a"
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_GID_INDEX: "3"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: WARN
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  OMP_NUM_THREADS: 8

  VLLM_USE_RAY_V2_EXECUTOR_BACKEND: "1"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "1"
  RAY_CGRAPH_get_timeout: "1800"

  RAY_memory_monitor_refresh_ms: "0"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NCCL_NVLS_ENABLE: "0"
  NCCL_BUFFSIZE: "16777216"

  TORCH_EXTENSIONS_DIR: /cache/huggingface/torch_extensions
  TORCHINDUCTOR_CACHE_DIR: /cache/huggingface/torchinductor-cache
  TRITON_CACHE_DIR: /cache/huggingface/triton-cache
  XDG_CACHE_HOME: /cache/huggingface
  B12X_CUTE_COMPILE_CACHE_DIR: /root/.cache/huggingface/b12x/cute_compile
  B12X_LOG_CUTE_COMPILES_AFTER_ENGINE_START: "0"

  CUTE_DSL_ARCH: "sm_121a"
  NCCL_MAX_NCHANNELS: "4"
  NCCL_MIN_NCHANNELS: "4"

  VLLM_DCP_QUERY_SPLIT: "0"
  VLLM_B12X_MLA_CKG_GATHER: "1"

  VLLM_ADAPTIVE_SPEC_DEPTHS: "2,4,5"
  VLLM_MTP_INSTRUMENT: "1"
  VLLM_MTP_INSTRUMENT_WINDOW: "32"

command: |
  vllm serve /root/models/models14/glm52-quanttrio-vision \
    --served-model-name GLM-5.2-Int4-Int8-Vision \
    --served-model-name GLM-5.2-Int4-Int8 \
    --host 0.0.0.0 --port 5001 \
    --trust-remote-code \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --async-scheduling \
    --tensor-parallel-size 8 \
    --pipeline-parallel-size 1 \
    --decode-context-parallel-size 1 \
    --dcp-kv-cache-interleave-size 1 \
    --attention-backend B12X_MLA_SPARSE \
    --hf-overrides '{{"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}}' \
    --max-model-len 410000 \
    --max-num-seqs 4 \
    --max-num-batched-tokens 4096 \
    --long-prefill-token-threshold 2048 \
    --enable-decode-aware-prefill \
    --decode-prefill-token-budget 512 \
    --idle-prefill-token-budget 16384 \
    --max-long-prefills-per-step 1 \
    --gpu-memory-utilization 0.69 \
    --kv-cache-dtype nvfp4_ds_mla \
    --distributed-executor-backend ray \
    --compilation-config '{{"cudagraph_mode":"FULL","max_cudagraph_capture_size":30}}' \
    --generation-config vllm \
    --default-chat-template-kwargs '{{"reasoning_effort":"high", "clear_thinking": false}}' \
    --speculative-config '{{"model":"/root/models/models14/GLM-5.2-Int4-Int8","draft_attention_backend":"B12X_MLA_SPARSE","method":"mtp","quantization":"compressed-tensors","draft_attention_backend":"B12X_MLA_SPARSE","num_speculative_tokens":5,"adaptive_speculative_tokens_window":32,"draft_tensor_parallel_size":1}}' \
    --limit-mm-per-prompt '{{"image":3,"video":0}}' \
    --mm-processor-cache-gb 0 \
    --mm-encoder-tp-mode weights \
    --seed 42
