# GLM-5.2 Int4-Int8Mix (TP=8 + PP=1 on 8× GB10 / DGX Spark, QuantTrio)
#
# v16 stack: local-inference-lab/vllm @fathomless-firmament-v16-unified + b12x master
# TP=8 across 8 nodes, DCP=1, PP=1
# MTP k=4 with B12X_MLA_SPARSE attention
#
# Container: vllm-node-tf5-glm52-v16:latest
# Model:     QuantTrio/GLM-5.2-Int4-Int8Mix
#
# Patches in this image (patches/v16-final/):
#   01-pr72-1-draft-dcp-config-propagation.patch  (DCP config propagation)
#   03-draft-quant-packed-mapping.patch            (quantized NextN drafts)
#   04-v16-essential.patch                         (SupportsPP + stale topk + embed_tokens)
#   06-b12x-stale-topk-buffer.patch                (B12X_MLA_SPARSE stale topk_indices_buffer fix)

recipe_version: "1"
name: GLM-5.2-Int4-Int8-TP8
description: GLM-5.2 Int4-Int8Mix (QuantTrio) on 8× GB10, TP=8 + PP=1, MTP k=4
raw_entrypoint: true
shared_weights_nfs: true
cluster_only: true

# v16 stack image
container: vllm-node-tf5-glm52-v16:latest

# Model weights — NFS-mounted at /root/models/models14 inside container
model: /root/models/models14/GLM-5.2-Int4-Int8


# Environment — v16 stack
env:
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  LD_PRELOAD: /opt/nccl-2.30.4/lib/libnccl.so.2
  LD_LIBRARY_PATH: /opt/nccl-2.30.4/lib
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"

  # V2 runner + B12X sparse indexer (required for B12X_MLA_SPARSE)
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  GLM52_BIND_HOST_TRITON: "0"
  VLLM_B12X_MLA_SPEC_EXTEND_AS_DECODE: "1"

  # DCP env vars (no-ops at DCP=1)
  VLLM_DCP_GLOBAL_TOPK: "1"
  VLLM_DCP_SHARD_DRAFT: "1"

  TORCH_CUDA_ARCH_LIST: "12.1a"
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_GID_INDEX: "3"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: WARN
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  OMP_NUM_THREADS: 8

  VLLM_USE_RAY_V2_EXECUTOR_BACKEND: "1"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "1"
  RAY_CGRAPH_get_timeout: "1800"

  # Stability + KV cache gains
  RAY_memory_monitor_refresh_ms: "0"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NCCL_NVLS_ENABLE: "0"
  NCCL_BUFFSIZE: "16777216"

  TORCH_EXTENSIONS_DIR: /cache/huggingface/torch_extensions
  TORCHINDUCTOR_CACHE_DIR: /cache/huggingface/torchinductor-cache
  TRITON_CACHE_DIR: /cache/huggingface/triton-cache
  XDG_CACHE_HOME: /cache/huggingface

  CUTE_DSL_ARCH: "sm_121a"
  NCCL_MAX_NCHANNELS: "4"
  NCCL_MIN_NCHANNELS: "4"

# Runtime mods applied inside container before vllm serve
mods:
  - mods/fix-fsm-toolcall

command: |
  vllm serve /root/models/models14/GLM-5.2-Int4-Int8 \
    --served-model-name GLM-5.2-Int4-Int8 \
    --host 0.0.0.0 --port 5001 \
    --trust-remote-code \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --async-scheduling \
    --tensor-parallel-size 8 \
    --pipeline-parallel-size 1 \
    --decode-context-parallel-size 1 \
    --dcp-kv-cache-interleave-size 1 \
    --attention-backend B12X_MLA_SPARSE \
    --hf-overrides '{{"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}}' \
    --max-model-len 500000 \
    --max-num-seqs 5 \
    --max-num-batched-tokens 4096 \
    --gpu-memory-utilization 0.75 \
    --kv-cache-dtype fp8_ds_mla \
    --distributed-executor-backend ray \
    --compilation-config '{{"cudagraph_mode":"FULL","max_cudagraph_capture_size":16}}' \
    --default-chat-template-kwargs '{{"reasoning_effort":"high", "clear_thinking": false}}' \
    --speculative-config '{{"method":"mtp","quantization":"compressed-tensors","draft_attention_backend":"B12X_MLA_SPARSE","num_speculative_tokens":4,"draft_tensor_parallel_size":1}}' \
    --seed 42