# GLM-5.2 Int4-Int8Mix — TP8+PP1 on 8× GB10, v18 stack

recipe_version: "1"
name: GLM-5.2-Int4-Int8-TP8-v18
description: GLM-5.2 Int4-Int8Mix (unpruned QuantTrio) on 8× GB10, v18 stack, TP=8 + PP=1, MTP k=4
raw_entrypoint: true
shared_weights_nfs: true
cluster_only: true

# v18 stack image (aarch64/SM121 build from blackwell-llm-docker)
container: vllm-node-tf5-glm52-v18:latest

# Model weights — NFS-mounted at /root/models/models14 inside container
model: /root/models/models14/GLM-5.2-Int4-Int8

# Environment — v18 stack
env:
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  # v18 image has NCCL at /opt/libnccl.so.2.30.4 (built in, not external mount)
  LD_PRELOAD: /opt/libnccl-local-inference.so.2.30.4
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"

  # V2 runner + B12X sparse indexer (required for B12X_MLA_SPARSE)
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  GLM52_BIND_HOST_TRITON: "0"
  VLLM_B12X_MLA_SPEC_EXTEND_AS_DECODE: "1"

  TORCH_CUDA_ARCH_LIST: "12.1a"
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_GID_INDEX: "3"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: WARN
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  OMP_NUM_THREADS: 8

  VLLM_USE_RAY_V2_EXECUTOR_BACKEND: "1"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "1"
  RAY_CGRAPH_get_timeout: "1800"

  # Stability + KV cache gains
  RAY_memory_monitor_refresh_ms: "0"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NCCL_NVLS_ENABLE: "0"
  NCCL_BUFFSIZE: "16777216"

  TORCH_EXTENSIONS_DIR: /cache/huggingface/torch_extensions
  TORCHINDUCTOR_CACHE_DIR: /cache/huggingface/torchinductor-cache
  TRITON_CACHE_DIR: /cache/huggingface/triton-cache
  XDG_CACHE_HOME: /cache/huggingface
  B12X_CUTE_COMPILE_CACHE_DIR: /root/.cache/huggingface/b12x/cute_compile
  B12X_LOG_CUTE_COMPILES_AFTER_ENGINE_START: "0"

  CUTE_DSL_ARCH: "sm_121a"
  NCCL_MAX_NCHANNELS: "4"
  NCCL_MIN_NCHANNELS: "4"

  # v18 DCP fast-path (auto-enabled for TP8/DCP4+, disabled for DCP1)
  VLLM_DCP_QUERY_SPLIT: "0"
  VLLM_B12X_MLA_CKV_GATHER: "1"


# Runtime mods applied inside container before vllm serve
mods:
  - mods/fix-v18-venv-paths       # Symlink /opt/venv -> dist-packages for mod compatibility (MUST be first)
  - mods/fix-mtp-quant-packed-mapping  # packed_modules_mapping for fused_qkv_a_proj + gate_up_proj in MTP draft quant config
  - mods/fix-dsa-block-table-dim    # Off-by-one in expanded_block_table_buffer (concurrent MTP decode crash)
  - mods/fix-fsm-toolcall-v18     # PR #44993: FSM should_advance new_token_ids fix (adapted for v18 source)
  - mods/fix-b12x-cute-cache-key  # B12X PR #41: deterministic CuTe DSL cache keys (eliminates decode warmup JIT)
  - mods/decode-aware-scheduler   # Custom decode-aware prefill scheduler (penguinchang)
  - mods/fix-v16-b12x-stale-topk  # Stale topk_indices_buffer fix (may be in v18, defensive)

command: |
  vllm serve /root/models/models14/GLM-5.2-Int4-Int8 \
    --served-model-name GLM-5.2-Int4-Int8 \
    --host 0.0.0.0 --port 5001 \
    --trust-remote-code \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --async-scheduling \
    --tensor-parallel-size 8 \
    --pipeline-parallel-size 1 \
    --decode-context-parallel-size 1 \
    --dcp-kv-cache-interleave-size 1 \
    --attention-backend B12X_MLA_SPARSE \
    --hf-overrides '{{"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}}' \
    --max-model-len 410000 \
    --max-num-seqs 5 \
    --max-num-batched-tokens 4096 \
    --long-prefill-token-threshold 2048 \
    --enable-decode-aware-prefill \
    --decode-prefill-token-budget 256 \
    --idle-prefill-token-budget 16384 \
    --max-long-prefills-per-step 1 \
    --gpu-memory-utilization 0.726 \
    --kv-cache-dtype fp8_ds_mla \
    --distributed-executor-backend ray \
    --compilation-config '{{"cudagraph_mode":"FULL","max_cudagraph_capture_size":16}}' \
    --default-chat-template-kwargs '{{"reasoning_effort":"high", "clear_thinking": false}}' \
    --speculative-config '{{"method":"mtp","quantization":"compressed-tensors","draft_attention_backend":"B12X_MLA_SPARSE","num_speculative_tokens":4,"draft_tensor_parallel_size":1}}' \
    --seed 42
