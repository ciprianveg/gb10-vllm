name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to build'
        type: choice
        options: [kimi-k3, glm-5.2-v16, glm-5.2-v18, glm-5.2-v18-vision]
        default: 'kimi-k3'
      tag:
        description: 'Docker tag'
        type: string
        default: 'latest'

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN }}

jobs:
  build:
    runs-on: [self-hosted, linux, arm64, gb10]  # Requires GB10 runner
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        model: [kimi-k3]
        # include:
        #   - model: glm-5.2-v16
        #   - model: glm-5.2-v18
        #   - model: glm-5.2-v18-vision
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ciprianveg/gb10-vllm/${{ matrix.model }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.model == 'kimi-k3' && 'kimi-k3/v1' || replace(matrix.model, 'glm-5.2-', 'glm-5.2/') }}
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VLLM_REF=codex/hh-kimi-k3-dspark-dcp16-20260804
            INSTALL_B12X=1
            BUILD_JOBS=16
            CACHEBUST_FLASHINFER=1
            CACHEBUST_VLLM=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64
          load: false

      - name: Image digest
        run: echo "Image digest: ${{ steps.build.outputs.digest }}"

  test:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, arm64, gb10]
    timeout-minutes: 60
    steps:
      - name: Pull image
        run: docker pull ghcr.io/ciprianveg/gb10-vllm/kimi-k3:latest

      - name: Run quick test
        run: |
          docker run --rm --gpus all --shm-size=32g \
            ghcr.io/ciprianveg/gb10-vllm/kimi-k3:latest \
            python3 -c "
import torch
import vllm
print(f'PyTorch: {torch.__version__}')
print(f'vLLM: {vllm.__version__}')
print(f'CUDA: {torch.version.cuda}')
print(f'GPU: {torch.cuda.get_device_name(0)}')
print('SUCCESS: Image loads correctly')
"

  release:
    needs: [build, test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
