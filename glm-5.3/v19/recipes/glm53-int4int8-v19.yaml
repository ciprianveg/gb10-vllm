# GLM-5.3 Int4-Int8Mix (Tech2wild) text-only — TP8+PP1 on 8× GB10, v19-vision image
#
# Same recipe as GLM-5.2 v19-vision (glm-5.2/v19/recipes/glm52-int4int8-v19-vision.yaml)
# with the model swapped to GLM-5.3, minus the multimodal flags (text-only serving —
# no vision composite needed, serves the Tech2wild checkpoint directly).
#
# GLM-5.3 shares GLM-5.2's architecture (glm_moe_dsa, hidden 6144, same vocab, same
# MTP layout), so the proven v19 image runs it unchanged — no rebuild, no runtime mods:
#
#   docker pull ghcr.io/ciprianveg/gb10-glm-5.2:v19-vision
#
# v19-vision = v18.1-vision + two baked-in source patches:
#   1. DCP1 query split (PR #175 backport) — +10% prefill at 200K context
#   2. Deterministic MoE align — fixes temp-0 nondeterminism at DCP=1
#
# Adaptive MTP 2/4/5, num_speculative_tokens=5. fp8 KV cache (fp8_ds_mla).
#
# Image: linux/arm64, built for GB10 / sm_121 — will NOT run on x86_64.

recipe_version: "1"
name: GLM-5.3-Int4-Int8-TP8-v19
description: GLM-5.3 Int4-Int8Mix (Tech2wild) text-only on 8× GB10, TP=8 + PP=1, v19-vision image (same arch/stack as GLM-5.2 v19), fp8 KV cache, adaptive MTP 2/4/5, DCP1 query split, deterministic MoE align
raw_entrypoint: true
shared_weights_nfs: true
cluster_only: true

# v19-vision image — identical image as GLM-5.2 v19 (no rebuild needed for 5.3).
container: ghcr.io/ciprianveg/gb10-glm-5.2:v19-vision

# Model weights — Tech2wild/GLM-5.3-Int4-Int8Mix, NFS-mounted inside container.
model: /root/models/models118/Tech2wild/GLM-5.3-Int4-Int8Mix

env:
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  LD_PRELOAD: /opt/libnccl-local-inference.so.2.30.4
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"

  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  GLM52_BIND_HOST_TRITON: "0"
  VLLM_B12X_MLA_SPEC_EXTEND_AS_DECODE: "1"

  TORCH_CUDA_ARCH_LIST: "12.1a"
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_GID_INDEX: "3"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: WARN
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  # Activate the deterministic MoE-align path (baked into v19-vision image).
  # Removes the compounding Marlin WNA16 placement nondeterminism (Bug 2).
  DETERMINISTIC_MOE_ALIGN: "1"
  OMP_NUM_THREADS: 8

  VLLM_USE_RAY_V2_EXECUTOR_BACKEND: "1"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "1"
  RAY_CGRAPH_get_timeout: "1800"

  RAY_memory_monitor_refresh_ms: "0"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NCCL_NVLS_ENABLE: "0"
  NCCL_BUFFSIZE: "16777216"

  TORCH_EXTENSIONS_DIR: /cache/huggingface/torch_extensions
  TORCHINDUCTOR_CACHE_DIR: /cache/huggingface/torchinductor-cache
  TRITON_CACHE_DIR: /cache/huggingface/triton-cache
  XDG_CACHE_HOME: /cache/huggingface
  B12X_CUTE_COMPILE_CACHE_DIR: /root/.cache/huggingface/b12x/cute_compile
  B12X_LOG_CUTE_COMPILES_AFTER_ENGINE_START: "0"

  CUTE_DSL_ARCH: "sm_121a"
  NCCL_MAX_NCHANNELS: "4"
  NCCL_MIN_NCHANNELS: "4"

  # DCP1 query split — share indexer work across TP ranks at DCP=1 (baked into v19-vision).
  VLLM_DCP_QUERY_SPLIT: "1"
  VLLM_B12X_MLA_CKG_GATHER: "1"

  VLLM_ADAPTIVE_SPEC_DEPTHS: "2,4,5"
  VLLM_MTP_INSTRUMENT: "1"
  VLLM_MTP_INSTRUMENT_WINDOW: "32"

command: |
  vllm serve /root/models/models118/Tech2wild/GLM-5.3-Int4-Int8Mix \
    --served-model-name GLM-5.3-Int4-Int8 \
    --host 0.0.0.0 --port 5001 \
    --trust-remote-code \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --async-scheduling \
    --tensor-parallel-size 8 \
    --pipeline-parallel-size 1 \
    --decode-context-parallel-size 1 \
    --dcp-kv-cache-interleave-size 1 \
    --attention-backend B12X_MLA_SPARSE \
    --hf-overrides '{{"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}}' \
    --max-model-len 410000 \
    --max-num-seqs 4 \
    --max-num-batched-tokens 4096 \
    --long-prefill-token-threshold 2048 \
    --enable-decode-aware-prefill \
    --decode-prefill-token-budget 1024 \
    --idle-prefill-token-budget 16384 \
    --max-long-prefills-per-step 1 \
    --gpu-memory-utilization 0.69 \
    --kv-cache-dtype fp8_ds_mla \
    --distributed-executor-backend ray \
    --compilation-config '{{"cudagraph_mode":"FULL","max_cudagraph_capture_size":30}}' \
    --generation-config vllm \
    --default-chat-template-kwargs '{{"reasoning_effort":"high", "clear_thinking": false}}' \
    --speculative-config '{{"model":"/root/models/models118/Tech2wild/GLM-5.3-Int4-Int8Mix","draft_attention_backend":"B12X_MLA_SPARSE","method":"mtp","quantization":"compressed-tensors","num_speculative_tokens":5,"draft_sample_method":"probabilistic","adaptive_speculative_tokens_window":32,"draft_tensor_parallel_size":1}}' \
    --seed 42
