# KIMI-K3 MXFP4 — v3 sm121 image + TP16 + DCP8 + RedHat DSpark s6
#
# Production recipe. All fixes/perf mods are baked into the image — mods: []
# TP16 with DCP8: MLA latent KV is split 8x across ranks for the decode pass,
# which improves long-context decode speed versus plain TP16.
# 2M total context capacity, so 4 requests can each use 500k context.

recipe_version: "1"
name: kimi-k3-dcp-tp16-prd
description: KIMI-K3 v3 sm121 (baked mods) + DCP8 + RedHat DSpark s6, TP16, 16 GB10
raw_entrypoint: true
shared_weights_nfs: true
cluster_only: true

container: ghcr.io/ciprianveg/gb10-vllm/kimi-k3:v3-sm121
container_name: vllm_node_kimi3_prd

model: /root/models/models115/Kimi-K3

defaults:
  model_path: /root/models/models115/Kimi-K3
  draft_model_path: /root/models/models11/RedHatAI-Kimi-K3-dspark

mods: []

env:
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: "1"
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "0"
  VLLM_KIMI_FUSED_TOPK16: "1"
  VLLM_USE_FLASHINFER_MOE_FP4: "1"
  VLLM_USE_FLASHINFER_MOE_FP16: "1"
  VLLM_NVFP4_GEMM_BACKEND: flashinfer-b12x
  VLLM_FLASHINFER_ALLREDUCE_BACKEND: trtllm
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  CUDA_MODULE_LOADING: LAZY
  CUDA_MODULE_DATA_LOADING: LAZY
  SAFETENSORS_FAST_GPU: "1"
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_GID_INDEX: "3"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: WARN
  NCCL_NVLS_ENABLE: "0"
  NCCL_BUFFSIZE: "16777216"
  NCCL_MAX_NCHANNELS: "2"
  NCCL_MIN_NCHANNELS: "2"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "0"
  INSTANTTENSOR_MAX_FREE_MEM_USAGE: "0.5"
  INSTANTTENSOR_COPY: "1"
  INSTANTTENSOR_BUFFER_SIZE: "536870912"
  VLLM_DSPARK_DRAFT_KV_WINDOW: "32768"
  VLLM_DCP_SHARD_DRAFT: "0"
  OMP_NUM_THREADS: "8"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "1"
  RAY_CGRAPH_get_timeout: "1800"
  RAY_memory_monitor_refresh_ms: "0"
  TORCH_EXTENSIONS_DIR: /cache/huggingface/torch_extensions
  TORCHINDUCTOR_CACHE_DIR: /cache/huggingface/torchinductor-cache
  TRITON_CACHE_DIR: /cache/huggingface/triton-cache
  XDG_CACHE_HOME: /cache/huggingface

command: |
  vllm serve {model_path} \
    --served-model-name KIMI-K3 \
    --attention-backend B12X_MLA \
    --tensor-parallel-size 16 \
    --pipeline-parallel-size 1 \
    --decode-context-parallel-size 8 \
    --dcp-kv-cache-interleave-size 1 \
    --enable-expert-parallel \
    --disable-custom-all-reduce \
    --distributed-executor-backend ray \
    --moe-backend marlin \
    --kv-cache-dtype fp8 \
    --load-format instanttensor \
    --gpu-memory-utilization 0.881 \
    --kv-cache-memory-bytes 5000000000 \
    --max-model-len 500000 \
    --host 0.0.0.0 --port 5002 \
    --trust-remote-code \
    --async-scheduling \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --speculative-config '{{"method":"dspark","model":"{draft_model_path}","num_speculative_tokens":6,"draft_tensor_parallel_size":1,"draft_sample_method":"greedy","rejection_sample_method":"block" ,"attention_backend":"TRITON_ATTN"}}' \
    --max-num-batched-tokens 4096 \
    --max-num-seqs 4 \
    --enforce-eager \
    --reasoning-parser kimi_k3 \
    --tool-call-parser kimi_k3 \
    --enable-auto-tool-choice \
    --generation-config vllm \
    --attention-config '{{"use_prefill_query_quantization":true}}' \
    --limit-mm-per-prompt '{{"image":5,"video":0}}' \
    --disable-uvicorn-access-log
